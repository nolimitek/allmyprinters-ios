# AllMyPrinters für iOS — Xcode-Projekt wird in GitHub Actions per XcodeGen erzeugt (kein .xcodeproj im Repo)
name: AllMyPrinters
options:
  bundleIdPrefix: com.allmyprinters
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.19.6"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  AllMyPrinters:
    type: application
    platform: iOS
    dependencies:
      - sdk: libz.tbd
      # Druck-Meldungen entschlüsseln (Notify/), wird in die App eingebettet
      - target: AllMyPrintersNotify
    sources:
      - path: App
      - path: Shared
      - path: Support/Localizable
      - path: www
        type: folder
        buildPhase: resources
      - path: Support/Assets.xcassets
      - path: Support/PrivacyInfo.xcprivacy
        buildPhase: resources
    scheme: {}
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: AllMyPrinters
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, de, fr, es, it, nl]
        # geteilter Schlüsselbund mit der Extension (Shared/PushText.swift PushStore)
        AMPKeychainGroup: $(AppIdentifierPrefix)com.allmyprinters.shared
        # nur Standard-Verschlüsselung des Systems (TLS, CommonCrypto) → keine Exportdokumente
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIViewControllerBasedStatusBarAppearance: true
        # Drucker im Heimnetz sprechen HTTP ohne TLS
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "AllMyPrinters spricht direkt mit deinen 3D-Druckern im Heimnetz."
        NSBonjourServices: [_http._tcp, _octoprint._tcp, _moonraker._tcp]
        NSCameraUsageDescription: "Zum Scannen von QR-Codes (Agent koppeln, Spulen-Etiketten)."
        # NFC-Spulenetiketten lesen/beschreiben (App/Nfc.swift); ISO-7816-Kennung nötig, damit solche Tags überhaupt gemeldet werden
        NFCReaderUsageDescription: "Zum Lesen und Beschreiben der NFC-Etiketten deiner Spulen."
        com.apple.developer.nfc.readersession.iso7816.select-identifiers: [D2760000850101]
        # Neuigkeiten im Hintergrund (App/News.swift, BGAppRefreshTask)
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.allmyprinters.app.news]
        # Agent-Modus: allmyprinters.com/web braucht einen Service Worker — in WKWebView nur für App-gebundene Domains
        # „app“ = eigene Oberfläche amp://app (sonst sperrt WebKit dort Skripte und Brücke), dazu limitsNavigationsToAppBoundDomains
        WKAppBoundDomains: [app, allmyprinters.com]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allmyprinters.app
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        # TestFlight-Lauf setzt AMP_PROFILE / AMP_PROFILE_NSE (je Ziel ein eigenes Profil)
        PROVISIONING_PROFILE_SPECIFIER: $(AMP_PROFILE)
  AllMyPrintersNotify:
    type: app-extension
    platform: iOS
    sources:
      - path: Notify
      - path: Shared
    info:
      path: Notify/Info.plist
      properties:
        CFBundleDisplayName: AllMyPrinters
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AMPKeychainGroup: $(AppIdentifierPrefix)com.allmyprinters.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allmyprinters.app.notify
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Notify/Notify.entitlements
        PROVISIONING_PROFILE_SPECIFIER: $(AMP_PROFILE_NSE)
        SKIP_INSTALL: YES
