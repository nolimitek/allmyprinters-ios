name: ios
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Xcode 27.1 (iOS-27.1-SDK): erst damit nutzt die App den ganzen Bildschirm des iPhone Duo (iPhone19,4, faltbar) — mit dem
      # iOS-26-SDK läuft sie dort nur in einem kleinen Fenster (Meldung #36, 28.11.2026). 27.2 meldete beim Hochladen teils
      # „Unsupported SDK or Xcode version“ → bewusst 27.1.x.
      - name: Xcode 27.1 wählen (iOS-27.1-SDK, iPhone Duo)
        run: |
          X=$(ls -d /Applications/Xcode_27.1*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || { ls -d /Applications/Xcode*.app; echo "kein Xcode 27.1 auf dem Runner"; exit 1; }
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos
      - name: Werkzeuge
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Projekt erzeugen (XcodeGen)
        run: xcodegen generate
      - name: Bauen (Simulator, ohne Signatur)
        run: |
          xcodebuild -project AllMyPrinters.xcodeproj -scheme AllMyPrinters -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -80; tail -30 build.log; exit 1; }
          echo "Warnungen: $(grep -c 'warning:' build.log || true)"
      - name: Im Simulator starten
        run: mkdir -p ci-out && sh ci/smoke.sh 2>&1 | tee ci-out/smoke.txt
      # wie für TestFlight (Release, echtes Gerät), nur ohne Signatur — findet Fehler vor dem ersten Upload
      - name: Gerät (Release, ohne Signatur)
        run: |
          mkdir -p ci-out
          xcodebuild -project AllMyPrinters.xcodeproj -scheme AllMyPrinters -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO build > build-dev.log 2>&1 \
            || { grep -E "error:" build-dev.log | sort -u | head -80 | tee ci-out/release-fehler.txt; tail -30 build-dev.log; exit 1; }
          APP=$(ls -d build-dev/Build/Products/Release-iphoneos/*.app | head -1)
          { echo "Release-Gerät ok: $(du -sh "$APP" | cut -f1)"; ls "$APP" | grep -E "Assets.car|PrivacyInfo|AppIcon" ;
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP/Info.plist" 2>&1 | head -8;
            /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$APP/Info.plist";
            echo "Extensions: $(ls "$APP/PlugIns" 2>/dev/null | tr '\n' ' ')";
            /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$APP/PlugIns/AllMyPrintersNotify.appex/Info.plist" 2>&1;
            ls "$APP" | grep -c lproj;
            for l in de en fr; do echo "$l: $(plutil -convert json -o - "$APP/$l.lproj/InfoPlist.strings" 2>&1 | head -c 400)"; done;
            /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "$APP/Info.plist"; } | tee ci-out/release.txt
      - name: Ergebnisse → Zweig ci
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ job.status }}
        run: |
          mkdir -p ci-out
          if [ -f build.log ]; then grep -E "error:|warning:" build.log | sort -u | head -300 > ci-out/build-meldungen.txt; tail -60 build.log > ci-out/build-ende.txt; fi
          printf '%s\n' "commit ${GITHUB_SHA}" "lauf ${GITHUB_RUN_ID}" "status ${STATUS}" "zeit $(date -u +%FT%TZ)" > ci-out/LAUF.txt
          cd ci-out && git init -q -b ci && git add -A \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci ${GITHUB_RUN_ID} ${GITHUB_SHA}" \
            && git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci
