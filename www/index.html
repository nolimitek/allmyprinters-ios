<script>
(function(){var b=document.getElementById('fmMore'),m=document.getElementById('fmMoreSheet'),s=document.getElementById('fmMoreScrim');
function set(o){m.classList.toggle('on',o);s.classList.toggle('on',o);b.setAttribute('aria-expanded',o?'true':'false');m.setAttribute('aria-hidden',o?'false':'true');}
window.AMP_moreClose=function(){var o=m.classList.contains('on');set(false);return o;};
b.addEventListener('click',function(){set(!m.classList.contains('on'));});s.addEventListener('click',function(){set(false);});m.addEventListener('click',function(e){if(e.target.closest('a'))set(false);});
window.addEventListener('hashchange',function(){set(false);});
document.getElementById('fmTheme').addEventListener('click',function(){window.AMP_THEME.set(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');});})();
</script>
